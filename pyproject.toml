# the Python package: the module in python/triangle_utils with the C API
# library beside it, built by meson-python with the python option
[build-system]
build-backend = "mesonpy"
requires = ["meson-python>=0.18"]

[project]
name = "triangle-utils"
dynamic = ["version"]
description = "Meshes and grids for MODFLOW from Triangle"
readme = "README.md"
requires-python = ">=3.11"
# triangle-utils is CC0 1.0; Triangle, linked into the library, has its own
# terms (LICENSE-Triangle), and NOTICE says where its modified source is
license = "CC0-1.0 AND LicenseRef-Triangle"
license-files = ["LICENSE", "LICENSE-Triangle", "NOTICE"]
dependencies = ["numpy"]

[project.urls]
Source = "https://github.com/jdhughes-dev/triangle-utils"

[tool.meson-python]
# the module calls the library through ctypes and uses no Python C API, so a
# wheel built for one Python version serves every later one (abi3)
limited-api = true

[tool.meson-python.args]
# MSVC on Windows even where gcc is on the PATH, as on GitHub's runners,
# whose MinGW gcc builds a DLL that needs MinGW's runtime, and the static
# MSVC runtime, so the DLL needs nothing beside it
setup = ["-Dpython=true", "-Db_vscrt=mt", "--vsenv"]
install = ["--tags=runtime,python-runtime"]

[tool.cibuildwheel]
# one wheel for each platform, built for the oldest Python supported, so it
# serves every later one; it is tested in a clean environment
build = "cp311-*"
skip = "*-musllinux_*"
# 64-bit only, on each runner's own architecture
archs = ["auto64"]
test-requires = ["pytest"]
# every Python test except those of the program and MODFLOW 6, which need
# the program
test-command = "pytest -p no:cacheprovider {project}/test/python --ignore={project}/test/python/test_command_line.py --ignore={project}/test/python/test_modflow.py"

[tool.cibuildwheel.environment]
TRIANGLE_UTILS_TEST_INSTALLED = "1"
