name: triangle-utils wheels
# builds the Python package's wheels (pyproject.toml) and tests each in a
# clean environment; publishing them to PyPI is part of the release (#10)
on:
  push:
    paths:
      - 'src/**'
      - 'python/**'
      - 'test/python/**'
      - 'subprojects/*.wrap'
      - 'meson.build'
      - 'meson.options'
      - 'pyproject.toml'
      - 'LICENSE'
      - 'LICENSE-Triangle'
      - 'NOTICE'
      - 'README.md'
      - 'scripts/check_wheel.py'
      - 'doc/UserGuide/valley.py'
      - '.github/workflows/wheels.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'python/**'
      - 'test/python/**'
      - 'subprojects/*.wrap'
      - 'meson.build'
      - 'meson.options'
      - 'pyproject.toml'
      - 'LICENSE'
      - 'LICENSE-Triangle'
      - 'NOTICE'
      - 'README.md'
      - 'scripts/check_wheel.py'
      - 'doc/UserGuide/valley.py'
      - '.github/workflows/wheels.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  # the oldest macOS the wheel runs on, for the build and its check
  MACOSX_DEPLOYMENT_TARGET: '11.0'
jobs:
  wheel:
    name: ${{ matrix.os }} wheel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Linux x86_64 and aarch64, macOS arm64, and Windows AMD64, each on a
        # runner of its own architecture; not macOS x86_64, which Triangle's
        # CI does not test
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2022]
    steps:
      - name: Checkout triangle-utils
        uses: actions/checkout@v7

      - name: Build and test the wheel
        uses: pypa/cibuildwheel@v4.3.5

      - name: Check the wheel's files and library
        shell: bash
        run: python scripts/check_wheel.py wheelhouse/*.whl

      - name: Upload the wheel
        uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.os }}
          path: wheelhouse/*.whl
          retention-days: 7

  # the abi3 wheel built for Python 3.11, installed on the newest Python
  newest-python:
    name: ${{ matrix.os }} wheel on Python 3.15
    needs: wheel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2022]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout triangle-utils
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.15'

      - name: Download the wheel
        uses: actions/download-artifact@v8
        with:
          name: wheel-${{ matrix.os }}
          path: wheelhouse

      # the tests of pyproject.toml's test-command, less the license test,
      # whose subproject is not downloaded here; the wheel job runs it
      - name: Install and test the wheel
        env:
          TRIANGLE_UTILS_TEST_INSTALLED: '1'
        run: |
          python -m venv venv
          # the venv's Python, in Scripts on Windows
          venv_python=$PWD/venv/bin/python
          if [ ! -x "$venv_python" ]; then venv_python=$PWD/venv/Scripts/python.exe; fi
          "$venv_python" -m pip install wheelhouse/*.whl pytest
          cd venv
          "$venv_python" -m pytest -p no:cacheprovider ../test/python --ignore=../test/python/test_command_line.py --ignore=../test/python/test_modflow.py -k "not test_triangle_license"
