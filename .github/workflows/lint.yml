name: triangle-utils lint
on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  PIXI_BETA_WARNING_OFF: true
jobs:
  lint:
    name: Check format, lint, and spelling
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout triangle-utils
        uses: actions/checkout@v7

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.82.1

      - name: Check format, lint, and spelling
        run: pixi run check-format
